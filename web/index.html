 <!DOCTYPE html>
<html>
<head>
<title>Login</title>

<style>
body{
  margin:0;
  font-family: Arial;
  background: linear-gradient(120deg,#4facfe,#00f2fe);
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
}

.container{
  background: white;
  padding:32px;
  border-radius:15px;
  width:320px;
  box-shadow:0 10px 25px rgba(0,0,0,0.3);
  text-align:center;
}

h2{
  margin-bottom:20px;
}

input{
  width:100%;
  padding:10px;
  margin:10px 0;
  border-radius:8px;
  border:1px solid #ccc;
}

button{
  width:100%;
  padding:10px;
  border:none;
  background:#4facfe;
  color:white;
  border-radius:8px;
  cursor:pointer;
}

button:hover{
  background:#007bff;
}

a{
  text-decoration:none;
  color:#4facfe;
}
</style>

</head>

<body>

<div class="container">
<h2>Login</h2>

<form action="LoginServlet" method="post">
<input type="email" name="email" placeholder="Enter Email" required>
<input type="password" name="password" placeholder="Enter Password" required>
<button type="submit">Login</button>
</form>

<p>Don't have account? <a href="register.jsp">Register</a></p>

</div>

</body>
</html>
